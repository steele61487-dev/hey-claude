      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/hey-claude.apk
          ls -la out

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hey-claude-apk
          path: out/hey-claude.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/hey-claude.apk \
            --title "Hey Claude (latest build)" \
            --notes "Download hey-claude.apk and open it on your Android phone to install."
